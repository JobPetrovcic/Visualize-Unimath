name: "Check and visualize"
on:
  push:
  schedule:
    - cron:  '30 7,19 * * *'

jobs:
  check-if-modified:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      modified: ${{ steps.check-latest.outputs.modified }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: check-latest
        id: check-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_commit=$(gh api repos/Unimath/agda-unimath/commits --jq '.[0].sha')
          if [[ ! "$current_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Did not get a valid commit SHA from the GitHub API (got: '$current_commit'). Aborting to avoid corrupting last_commit.txt."
            exit 1
          fi
          if [[ "$current_commit" == "$(cat last_commit.txt)" ]]
          then
            value=false
          else
            value=true
          fi
          echo "Modifier: $value"
          echo "modified=$value" >> $GITHUB_OUTPUT
          echo $current_commit > last_commit.txt
      - uses: stefanzweifel/git-auto-commit-action@v5

  create-visualization:
    name: Visualize library
    runs-on: ubuntu-latest
    needs: check-if-modified
    if: ${{ needs.check-if-modified.outputs.modified == 'true' }}
    steps:
      - name: check-latest
        id: check-latest
        run: echo "hello"
      - name: Add swap space
        # main.py needs ~30 GB for agda-unimath; the runner has 16 GB RAM
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 40G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      - uses: actions/checkout@v5
        with:
          repository: Unimath/agda-unimath
          ref: master
          path: mylib
      - uses: actions/checkout@v5
        with:
          repository: JobPetrovcic/agda-proof-assistent-assistent
          token: ${{ secrets.ACCESS }}
          ref: master
          path: agda-proof-assistent-assistent
      - uses: JobPetrovcic/Mathematical-Library-Vizualizer@main
        with:
          language: agda
          file_type: src/everything.lagda.md
          mode: standalone
          install_libs: no
          additional_commands: "make src/everything.lagda.md"
      - uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.ACCESS }}
        with:
          source-directory: "output"
          destination-github-username: "JobPetrovcic"
          destination-repository-name: "Unimath-Visualization-Deployment"
          user-email: job1.petrovcic@gmail.com
          target-branch: main